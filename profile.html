<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profile — Simple Prayer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <script type="module" src="js/pages/profile.js"></script>
  </head>
  <body class="with-fab">
    <div class="config-banner" data-config-banner hidden>
      Add your Supabase URL + anon key in <code>js/config.js</code>, then refresh.
    </div>

    <header class="container">
      <div data-app-nav></div>
    </header>

    <main class="section container profile-page">
      <h1 class="h1 profile-page__title">Your profile</h1>

      <div class="divider"></div>

      <div class="grid" style="grid-template-columns: repeat(12, 1fr); align-items: start">
        <div class="card card--glow profile-identity" style="grid-column: span 12">
          <div class="card__pad">
            <div class="profile-head">
              <div>
                <div class="h2" style="margin-bottom: 6px" data-display-name></div>
                <div class="muted">@<span data-username></span></div>
                <p class="muted" style="margin-top: 12px" data-bio></p>
              </div>
            </div>
          </div>
        </div>

        <div class="card" style="grid-column: span 12">
          <div class="card__pad">
            <div class="row">
              <h2 class="h2" style="margin: 0">Your prayer requests</h2>
              <a class="link" href="friends.html">Find friends</a>
            </div>
            <div id="requests" class="stack" style="margin-top: 14px"></div>
          </div>
        </div>
      </div>
    </main>

    <a class="fab" href="create-prayer.html" aria-label="New prayer request">
      <span class="fab__glyph" aria-hidden="true">+</span>
    </a>
    <div data-app-bottom-nav hidden></div>
  </body>
</html>
