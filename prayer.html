<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prayer request — Gathered</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <script type="module" src="js/pages/prayer.js"></script>
  </head>
  <body>
    <div class="config-banner" data-config-banner hidden>
      Add your Supabase URL + anon key in <code>js/config.js</code>, then refresh.
    </div>

    <header class="container">
      <div data-app-nav></div>
    </header>

    <main class="section container">
      <div class="row">
        <a class="link" href="dashboard.html">← Back to feed</a>
        <a class="button button--ghost" id="open-profile" href="#" hidden>Open profile</a>
      </div>

      <div class="divider"></div>

      <div id="detail"></div>

      <div class="divider"></div>

      <section class="stack" id="pray-section" hidden>
        <h2 class="h2">Pray for them</h2>
        <p class="muted" style="margin: 0">Mark that you prayed. Optionally add a gentle encouragement.</p>

        <div class="card">
          <div class="card__pad">
            <div class="field">
              <div class="label">Encouragement (optional)</div>
              <div id="encouragement-choices" class="row" style="justify-content: flex-start; gap: 10px"></div>
            </div>
            <div class="form__actions" style="margin-top: 12px">
              <button class="button" type="button" id="pray-btn">I prayed</button>
              <span class="muted" id="pray-state"></span>
            </div>
          </div>
        </div>
      </section>

      <section class="stack" id="owner-tools" hidden>
        <h2 class="h2">Owner tools</h2>
        <div class="grid" style="grid-template-columns: repeat(12, 1fr); gap: 14px">
          <div class="card" style="grid-column: span 12">
            <div class="card__pad">
              <h3 class="h3">Update friends</h3>
              <form class="form" id="update-form">
                <div class="field">
                  <label class="label" for="update_body">Update</label>
                  <textarea class="textarea" id="update_body" required placeholder="What changed? What are you grateful for? What do you still need?"></textarea>
                </div>
                <button class="button" type="submit" id="post-update">Post update</button>
              </form>
            </div>
          </div>

          <div class="card" style="grid-column: span 12">
            <div class="card__pad">
              <h3 class="h3">Edit request</h3>
              <form class="form" id="edit-form">
                <div class="field">
                  <label class="label" for="title">Title</label>
                  <input class="input" id="title" required />
                </div>
                <div class="field">
                  <label class="label" for="description">Description</label>
                  <textarea class="textarea" id="description"></textarea>
                </div>
                <div class="grid" style="grid-template-columns: repeat(12, 1fr); gap: 12px">
                  <div class="field" style="grid-column: span 12">
                    <label class="label" for="category">Category</label>
                    <select class="select" id="category"></select>
                  </div>
                  <div class="field" style="grid-column: span 12">
                    <label class="label" for="visibility">Visibility</label>
                    <select class="select" id="visibility">
                      <option value="friends">Followers only</option>
                      <option value="public">Public</option>
                    </select>
                  </div>
                  <div class="field" style="grid-column: span 12">
                    <label class="label" for="status">Status</label>
                    <select class="select" id="status">
                      <option value="active">Active</option>
                      <option value="answered">Answered</option>
                      <option value="archived">Archived</option>
                    </select>
                  </div>
                </div>
                <button class="button" type="submit" id="save-request">Save changes</button>
              </form>
            </div>
          </div>
        </div>
      </section>

      <section class="stack">
        <h2 class="h2">Updates</h2>
        <div id="updates" class="stack"></div>
      </section>
    </main>
  </body>
</html>
